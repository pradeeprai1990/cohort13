<script>
    // let n="hello"
    // isNaN(n)



    let per=Number(prompt("Enter The Perc.."))
    //Nan ->Hello

    if(isNaN(per)){
        console.log("Please Fill Correct Per value");
        
    }
    else if(per>100 || per<0){
        console.log(per,"Invalid Per");
    }
    else if(per>=60){
        console.log(per,"First Div");
        
    }
    else if(per>=48){
        console.log(per,"Second Div");
    }
    else if(per>=35){
        console.log(per,"Third Div");
    }
    else{
        console.log(per," Fail");
        
    }

</script>
