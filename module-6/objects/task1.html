<script>
    function arrayOfsum(arr) {
        let total = 0
        for (let v of arr) {
            total += v
        }
        return total
    }


    let output = arrayOfsum([10, 44, 55, 6, 6, 66])
    console.log(output);

    let output1 = arrayOfsum([456, 66, 7, 7, 88, 99, 99])
    console.log(output1);

</script>
