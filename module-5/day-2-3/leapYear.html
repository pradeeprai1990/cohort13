<script>
    let year=Number(prompt("Enter The Year"))

    if(year%4==0 && year%100!=0){
        console.log(year,"Leap Year");
        
    }
    else if(year%400==0){
         console.log(year,"Leap Year");
    }
    else{
        console.log(year,"Not a leap year");
        
    }
    //Case1 -> year%4==0 && year%100!=0

    //Case2 -> year%400==0
</script>
